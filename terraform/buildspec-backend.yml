version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - 'echo "========== BACKEND INSTALL =========="'
      - aws --version
      - docker --version
      - node --version || true
      - npm --version || true

  pre_build:
    commands:
      - 'echo "========== BACKEND PRE-BUILD =========="'
      - 'echo "Source version: $CODEBUILD_RESOLVED_SOURCE_VERSION"'
      - export IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URL" | cut -d/ -f1)"
      - cd server
      - if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - |
        if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
          npm test
        else
          echo "No backend test script found; skipping tests."
        fi
      - 'echo "Logging in to Amazon ECR..."'
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - 'echo "========== BACKEND BUILD =========="'
      - docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .

  post_build:
    commands:
      - 'echo "========== BACKEND DEPLOY =========="'
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - |
        REQUIRED_VARS="
        ALB_LISTENER_ARN
        BLUE_TARGET_GROUP_ARN
        GREEN_TARGET_GROUP_ARN
        BLUE_ASG_NAME
        GREEN_ASG_NAME
        BLUE_IMAGE_TAG_PARAMETER_NAME
        GREEN_IMAGE_TAG_PARAMETER_NAME
        BACKEND_DESIRED_CAPACITY
        "
        for name in $REQUIRED_VARS; do
          if [ -z "${!name:-}" ]; then
            echo "Missing required environment variable: $name"
            exit 1
          fi
        done

        if [ "$BACKEND_DESIRED_CAPACITY" -lt 1 ]; then
          echo "BACKEND_DESIRED_CAPACITY must be at least 1 for blue-green deployment."
          exit 1
        fi
      - |
        LISTENER_ACTION_TYPE="$(aws elbv2 describe-listeners \
          --listener-arns "$ALB_LISTENER_ARN" \
          --query "Listeners[0].DefaultActions[0].Type" \
          --output text)"

        FORWARD_TARGET_GROUP_COUNT="$(aws elbv2 describe-listeners \
          --listener-arns "$ALB_LISTENER_ARN" \
          --query "length(Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups)" \
          --output text)"

        BLUE_TARGET_WEIGHT="$(aws elbv2 describe-listeners \
          --listener-arns "$ALB_LISTENER_ARN" \
          --query "Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups[?TargetGroupArn=='$BLUE_TARGET_GROUP_ARN'].Weight | [0]" \
          --output text)"

        GREEN_TARGET_WEIGHT="$(aws elbv2 describe-listeners \
          --listener-arns "$ALB_LISTENER_ARN" \
          --query "Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups[?TargetGroupArn=='$GREEN_TARGET_GROUP_ARN'].Weight | [0]" \
          --output text)"

        case "$FORWARD_TARGET_GROUP_COUNT" in
          ''|None|*[!0-9]*)
            echo "ALB listener forward target group count is missing or invalid."
            echo "Action type: $LISTENER_ACTION_TYPE"
            echo "Forward target group count: $FORWARD_TARGET_GROUP_COUNT"
            exit 1
            ;;
        esac

        if [ "$LISTENER_ACTION_TYPE" != "forward" ] || [ "$FORWARD_TARGET_GROUP_COUNT" -ne 2 ]; then
          echo "ALB listener does not have the expected weighted forward configuration."
          echo "Action type: $LISTENER_ACTION_TYPE"
          echo "Forward target group count: $FORWARD_TARGET_GROUP_COUNT"
          exit 1
        fi

        case "$BLUE_TARGET_WEIGHT" in
          ''|None|*[!0-9]*)
            echo "Expected blue target group ARN is missing or has an invalid weight."
            echo "Blue target weight: $BLUE_TARGET_WEIGHT"
            exit 1
            ;;
        esac

        case "$GREEN_TARGET_WEIGHT" in
          ''|None|*[!0-9]*)
            echo "Expected green target group ARN is missing or has an invalid weight."
            echo "Green target weight: $GREEN_TARGET_WEIGHT"
            exit 1
            ;;
        esac

        echo "Blue target weight: $BLUE_TARGET_WEIGHT"
        echo "Green target weight: $GREEN_TARGET_WEIGHT"

        if [ "$BLUE_TARGET_WEIGHT" -eq 100 ] && [ "$GREEN_TARGET_WEIGHT" -eq 0 ]; then
          ACTIVE_COLOR="BLUE"
          INACTIVE_COLOR="GREEN"
          ACTIVE_TG_ARN="$BLUE_TARGET_GROUP_ARN"
          INACTIVE_TG_ARN="$GREEN_TARGET_GROUP_ARN"
          ACTIVE_ASG_NAME="$BLUE_ASG_NAME"
          INACTIVE_ASG_NAME="$GREEN_ASG_NAME"
          INACTIVE_IMAGE_TAG_PARAMETER_NAME="$GREEN_IMAGE_TAG_PARAMETER_NAME"
        elif [ "$GREEN_TARGET_WEIGHT" -eq 100 ] && [ "$BLUE_TARGET_WEIGHT" -eq 0 ]; then
          ACTIVE_COLOR="GREEN"
          INACTIVE_COLOR="BLUE"
          ACTIVE_TG_ARN="$GREEN_TARGET_GROUP_ARN"
          INACTIVE_TG_ARN="$BLUE_TARGET_GROUP_ARN"
          ACTIVE_ASG_NAME="$GREEN_ASG_NAME"
          INACTIVE_ASG_NAME="$BLUE_ASG_NAME"
          INACTIVE_IMAGE_TAG_PARAMETER_NAME="$BLUE_IMAGE_TAG_PARAMETER_NAME"
        else
          echo "ALB listener target group weights are not in an expected 100/0 or 0/100 state."
          echo "Blue target weight: $BLUE_TARGET_WEIGHT"
          echo "Green target weight: $GREEN_TARGET_WEIGHT"
          exit 1
        fi

        echo "Current active environment: $ACTIVE_COLOR"
        echo "Deployment target: $INACTIVE_COLOR"
        echo "Active ASG: $ACTIVE_ASG_NAME"
        echo "Inactive ASG: $INACTIVE_ASG_NAME"
      - |
        echo "Scaling inactive environment down before preparing new release..."
        INACTIVE_ASG_CAPACITY_BEFORE="$(aws autoscaling describe-auto-scaling-groups \
          --auto-scaling-group-names "$INACTIVE_ASG_NAME" \
          --query "AutoScalingGroups[0].[MinSize,DesiredCapacity,MaxSize]" \
          --output text)"
        echo "Inactive ASG capacity before scale-down: min desired max = $INACTIVE_ASG_CAPACITY_BEFORE"

        aws autoscaling update-auto-scaling-group \
          --auto-scaling-group-name "$INACTIVE_ASG_NAME" \
          --min-size 0 \
          --desired-capacity 0

        for attempt in $(seq 1 30); do
          ASG_STATE="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$INACTIVE_ASG_NAME" \
            --query "AutoScalingGroups[0].[MinSize,DesiredCapacity,length(Instances[?LifecycleState=='InService' || LifecycleState=='Pending' || LifecycleState=='Pending:Wait' || LifecycleState=='Pending:Proceed' || LifecycleState=='Terminating' || LifecycleState=='Terminating:Wait' || LifecycleState=='Terminating:Proceed'])]" \
            --output text)"
          MIN_SIZE="$(echo "$ASG_STATE" | awk '{print $1}')"
          DESIRED_CAPACITY="$(echo "$ASG_STATE" | awk '{print $2}')"
          LIVE_INSTANCE_COUNT="$(echo "$ASG_STATE" | awk '{print $3}')"

          echo "Scale-down attempt $attempt: min=$MIN_SIZE desired=$DESIRED_CAPACITY live_instances=$LIVE_INSTANCE_COUNT"

          if [ "$MIN_SIZE" -eq 0 ] && [ "$DESIRED_CAPACITY" -eq 0 ] && [ "$LIVE_INSTANCE_COUNT" -eq 0 ]; then
            echo "Inactive environment is fully scaled down."
            break
          fi

          if [ "$attempt" -eq 30 ]; then
            echo "Timed out waiting for inactive environment to scale down."
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$INACTIVE_ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[*].[InstanceId,LifecycleState,HealthStatus]" \
              --output table
            exit 1
          fi

          sleep 10
        done
      - |
        echo "Updating inactive image tag parameter..."
        aws ssm put-parameter \
          --name "$INACTIVE_IMAGE_TAG_PARAMETER_NAME" \
          --type "String" \
          --value "$IMAGE_TAG" \
          --overwrite

        echo "Scaling inactive environment to $BACKEND_DESIRED_CAPACITY..."
        aws autoscaling update-auto-scaling-group \
          --auto-scaling-group-name "$INACTIVE_ASG_NAME" \
          --desired-capacity "$BACKEND_DESIRED_CAPACITY"
      - |
        echo "Waiting for inactive ASG capacity..."
        for attempt in $(seq 1 40); do
          ASG_STATE="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$INACTIVE_ASG_NAME" \
            --query "AutoScalingGroups[0].[DesiredCapacity,length(Instances),length(Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'])]" \
            --output text)"
          DESIRED_CAPACITY="$(echo "$ASG_STATE" | awk '{print $1}')"
          TOTAL_INSTANCE_COUNT="$(echo "$ASG_STATE" | awk '{print $2}')"
          INSERVICE_HEALTHY_COUNT="$(echo "$ASG_STATE" | awk '{print $3}')"

          echo "Scale-up attempt $attempt: desired=$DESIRED_CAPACITY total=$TOTAL_INSTANCE_COUNT inservice_healthy=$INSERVICE_HEALTHY_COUNT"

          if [ "$DESIRED_CAPACITY" -eq "$BACKEND_DESIRED_CAPACITY" ] && \
             [ "$TOTAL_INSTANCE_COUNT" -ge "$BACKEND_DESIRED_CAPACITY" ] && \
             [ "$INSERVICE_HEALTHY_COUNT" -ge "$BACKEND_DESIRED_CAPACITY" ]; then
            echo "Inactive ASG capacity is ready."
            break
          fi

          if [ "$attempt" -eq 40 ]; then
            echo "Timed out waiting for inactive ASG capacity."
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$INACTIVE_ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[*].[InstanceId,LifecycleState,HealthStatus]" \
              --output table
            exit 1
          fi

          sleep 15
        done
      - |
        echo "Waiting for inactive target group health..."
        for attempt in $(seq 1 40); do
          HEALTHY_COUNT="$(aws elbv2 describe-target-health \
            --target-group-arn "$INACTIVE_TG_ARN" \
            --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
            --output text)"

          TOTAL_COUNT="$(aws elbv2 describe-target-health \
            --target-group-arn "$INACTIVE_TG_ARN" \
            --query "length(TargetHealthDescriptions)" \
            --output text)"

          echo "Inactive health check attempt $attempt: healthy=$HEALTHY_COUNT total=$TOTAL_COUNT"

          if [ "$HEALTHY_COUNT" -ge "$BACKEND_DESIRED_CAPACITY" ]; then
            echo "Inactive target group is healthy."
            break
          fi

          if [ "$attempt" -eq 40 ]; then
            echo "Timed out waiting for inactive target group to become healthy."
            aws elbv2 describe-target-health \
              --target-group-arn "$INACTIVE_TG_ARN" \
              --query "TargetHealthDescriptions[*].[Target.Id,TargetHealth.State,TargetHealth.Reason,TargetHealth.Description]" \
              --output table
            exit 1
          fi

          sleep 15
        done
      - |
        echo "Smoke validation: target group health is healthy for $INACTIVE_COLOR."
        echo "Switching ALB listener to $INACTIVE_COLOR..."
        if [ "$INACTIVE_COLOR" = "BLUE" ]; then
          BLUE_TARGET_WEIGHT_AFTER=100
          GREEN_TARGET_WEIGHT_AFTER=0
        else
          BLUE_TARGET_WEIGHT_AFTER=0
          GREEN_TARGET_WEIGHT_AFTER=100
        fi

        FORWARD_ACTIONS="$(printf '[{"Type":"forward","ForwardConfig":{"TargetGroups":[{"TargetGroupArn":"%s","Weight":%s},{"TargetGroupArn":"%s","Weight":%s}]}}]' "$BLUE_TARGET_GROUP_ARN" "$BLUE_TARGET_WEIGHT_AFTER" "$GREEN_TARGET_GROUP_ARN" "$GREEN_TARGET_WEIGHT_AFTER")"

        aws elbv2 modify-listener \
          --listener-arn "$ALB_LISTENER_ARN" \
          --default-actions "$FORWARD_ACTIONS"

        NEW_BLUE_TARGET_WEIGHT="$(aws elbv2 describe-listeners \
          --listener-arns "$ALB_LISTENER_ARN" \
          --query "Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups[?TargetGroupArn=='$BLUE_TARGET_GROUP_ARN'].Weight | [0]" \
          --output text)"

        NEW_GREEN_TARGET_WEIGHT="$(aws elbv2 describe-listeners \
          --listener-arns "$ALB_LISTENER_ARN" \
          --query "Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups[?TargetGroupArn=='$GREEN_TARGET_GROUP_ARN'].Weight | [0]" \
          --output text)"

        echo "Blue target weight after switch: $NEW_BLUE_TARGET_WEIGHT"
        echo "Green target weight after switch: $NEW_GREEN_TARGET_WEIGHT"

        case "$NEW_BLUE_TARGET_WEIGHT" in
          ''|None|*[!0-9]*)
            echo "Blue target group weight is missing or invalid after switch."
            exit 1
            ;;
        esac

        case "$NEW_GREEN_TARGET_WEIGHT" in
          ''|None|*[!0-9]*)
            echo "Green target group weight is missing or invalid after switch."
            exit 1
            ;;
        esac

        if [ "$NEW_BLUE_TARGET_WEIGHT" -ne "$BLUE_TARGET_WEIGHT_AFTER" ] || \
           [ "$NEW_GREEN_TARGET_WEIGHT" -ne "$GREEN_TARGET_WEIGHT_AFTER" ]; then
          echo "Listener switch verification failed."
          exit 1
        fi
      - |
        echo "Verifying newly active target group health..."
        HEALTHY_COUNT="$(aws elbv2 describe-target-health \
          --target-group-arn "$INACTIVE_TG_ARN" \
          --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
          --output text)"

        if [ "$HEALTHY_COUNT" -lt "$BACKEND_DESIRED_CAPACITY" ]; then
          echo "New active target group does not have enough healthy targets after switch."
          exit 1
        fi

        echo "Blue-green deployment completed."
        echo "Previous environment: $ACTIVE_COLOR"
        echo "Current environment: $INACTIVE_COLOR"
        echo "Image tag: $IMAGE_TAG"
        echo "Previous environment retained for rollback."
