version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "========== BACKEND INSTALL =========="
      - aws --version
      - docker --version
      - node --version || true
      - npm --version || true

  pre_build:
    commands:
      - echo "========== BACKEND PRE-BUILD =========="
      - echo "Source version: $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URL" | cut -d/ -f1)"
      - cd server
      - if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - |
        if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
          npm test
        else
          echo "No backend test script found; skipping tests."
        fi
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - echo "========== BACKEND BUILD =========="
      - docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .

  post_build:
    commands:
      - echo "========== BACKEND DEPLOY =========="
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - |
        aws ssm put-parameter \
          --name "$BACKEND_IMAGE_TAG_PARAMETER_NAME" \
          --type "String" \
          --value "$IMAGE_TAG" \
          --overwrite
      - |
        aws autoscaling start-instance-refresh \
          --auto-scaling-group-name "$AUTOSCALING_GROUP_NAME" \
          --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}'
      - echo "Backend deployment started with image tag $IMAGE_TAG."
