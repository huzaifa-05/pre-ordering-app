version: 0.2

phases:
  install:
  commands:
    - echo "Installing Terraform..."
    - mkdir -p /tmp/terraform-install
    - curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
    - unzip -o /tmp/terraform.zip -d /tmp/terraform-install
    - mv /tmp/terraform-install/terraform /usr/local/bin/terraform
    - terraform version

  pre_build:
    commands:
      - cd terraform/environments/dev
      - aws sts get-caller-identity
      - terraform fmt -check -recursive
      - terraform init -input=false
      - terraform validate

  build:
    commands:
      - terraform plan -input=false -out=tfplan
      - terraform show -no-color tfplan | tee tfplan.txt

artifacts:
  base-directory: terraform/environments/dev
  files:
    - tfplan
    - tfplan.txt